---
# tasks file for test
- name: Apache installed on the Server
  ansible.builtin.apt:
    name: apache2
    state: latest
    update_cache: yes
  notify: Restart Apache

- name: Apache configuration updated
  ansible.builtin.copy:
    src: /tmp/Apache2.conf
    dest: /etc/apache2/apache2.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart Apache


